[build-system]
requires = ["scikit-build-core>=0.10", "nanobind==2.13.0", "drjit==1.5.0"]
build-backend = "scikit_build_core.build"

[project]
name = "psdr_jit"
version = "0.2.1"
description = "Path-space differentiable renderer with drjit as the numerical backend."
readme = "README.md"

requires-python = ">=3.10"
dependencies = ["drjit==1.5.0"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.24"]

[tool.scikit-build]
build.verbose = true
wheel.packages = ["src/psdr_jit"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
